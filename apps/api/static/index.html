<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
  :root {
    --bg: #06111b;
    --panel: rgba(12, 30, 45, 0.92);
    --panel-2: rgba(18, 42, 61, 0.9);
    --line: #24435a;
    --line-2: #3d6d8c;
    --cyan: #8eeaff;
    --cyan-dim: #4f9dbd;
    --text: #d6f3ff;
    --muted: #7194aa;
    --green: #3df59c;
    --red: #ff405f;
    --amber: #ffc456;
    --state: var(--cyan-dim);
    --glow: 0 0 6px rgba(142, 234, 255, 0.55);
    --cut: 14px;
    --ui: "Rajdhani", "Orbitron", "DIN Alternate", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  body[data-state="armed"] { --state: var(--cyan); }
  body[data-state="listening"] { --state: var(--green); }
  body[data-state="thinking"] { --state: var(--amber); }
  body[data-state="speaking"] { --state: #c6f6ff; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font: 500 15px/1.45 var(--ui); letter-spacing: 0.02em;
    background:
      radial-gradient(1200px 700px at 25% 35%, rgba(40, 110, 150, 0.18), transparent 60%),
      radial-gradient(900px 600px at 85% 80%, rgba(30, 80, 120, 0.15), transparent 60%),
      repeating-linear-gradient(0deg, rgba(120, 200, 255, 0.025) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(120, 200, 255, 0.025) 0 1px, transparent 1px 32px),
      var(--bg);
  }
  button, select, input { font: inherit; color: inherit; }
  .caps { text-transform: uppercase; letter-spacing: 0.14em; }
  .on { color: var(--green); }
  .off { color: var(--muted); }

  .hud {
    display: grid; gap: 16px; padding: 16px; min-height: 100%;
    grid-template-columns: minmax(330px, 400px) minmax(0, 1fr) minmax(290px, 340px);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top top top" "left center right" "foot foot foot";
    height: 100dvh;
  }

  /* ---- top bar ---- */
  .topbar { grid-area: top; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; letter-spacing: 0.2em; text-shadow: var(--glow); }
  .brand svg { width: 34px; height: 34px; }
  .status-pill {
    margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 7px 18px;
    border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel);
    font-size: 14px; box-shadow: inset 0 0 12px rgba(80, 160, 210, 0.12);
  }
  .status-pill b { color: var(--state); min-width: 210px; text-shadow: 0 0 8px var(--state); transition: color .3s; }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 150px; text-align: right; }

  /* ---- panels with cut corners ---- */
  .panel {
    position: relative; padding: 1px; background: var(--line);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    display: flex; min-height: 0;
  }
  .panel > .inner {
    flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--panel);
    clip-path: inherit;
  }
  .head {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 22px;
    border-bottom: 1px solid var(--line); background: var(--panel-2); font-size: 14px;
  }
  .head .title { flex: 1; }
  .head .deco { display: flex; gap: 4px; }
  .head .deco i { width: 22px; height: 14px; border: 1px solid var(--line-2); display: block; }
  .head .deco i:last-child { position: relative; }
  .head .deco i:last-child::before, .head .deco i:last-child::after {
    content: ""; position: absolute; left: 5px; right: 5px; top: 6px; height: 1px; background: var(--muted); transform: rotate(35deg);
  }
  .head .deco i:last-child::after { transform: rotate(-35deg); }
  .body { padding: 12px 16px; }

  /* ---- left column: core + wake control ---- */
  .left { grid-area: left; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .core { position: relative; aspect-ratio: 1; width: 100%; max-height: 52vh; align-self: center; }
  .core svg { width: 100%; height: 100%; overflow: visible; }
  .core .ring { fill: none; stroke: var(--line-2); }
  .core .state { stroke: var(--state); transition: stroke .4s; filter: drop-shadow(0 0 4px var(--state)); }
  .core .fill-state { fill: var(--state); transition: fill .4s; filter: drop-shadow(0 0 6px var(--state)); }
  .core .sector { fill: none; stroke: rgba(120, 190, 230, 0.13); }
  .core text { fill: var(--text); font-family: var(--mono); font-size: 12px; }
  .core .label { font-family: var(--ui); font-size: 15px; letter-spacing: 0.18em; fill: var(--state); }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
  .spin.rev { animation-direction: reverse; animation-duration: 40s; }
  body[data-state="thinking"] .spin { animation-duration: 5s; }
  body[data-state="thinking"] .spin.rev { animation-duration: 3s; }
  body[data-state="listening"] .pulse, body[data-state="speaking"] .pulse { animation: pulse 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.12); opacity: 0.75; } }
  .badge {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    font: 700 22px var(--mono); color: var(--cyan); text-shadow: var(--glow);
    padding: 0 10px; border-left: 2px solid var(--line-2); border-right: 2px solid var(--line-2);
  }
  .callout { position: absolute; font-size: 13px; color: var(--text); }
  .callout b { color: var(--green); font-weight: 600; }
  .callout.tl { top: 12%; left: 0; }
  .callout.br { bottom: 6%; right: 0; text-align: right; }

  .toggle {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 0; background: none; border: 0;
    border-bottom: 1px dashed rgba(80, 140, 180, 0.25); cursor: pointer; text-align: left;
  }
  .toggle .name { flex: 1; }
  .toggle .hint { color: var(--muted); font-size: 12px; letter-spacing: 0.06em; text-transform: none; }
  .toggle .val { font-weight: 700; min-width: 34px; text-align: right; }
  .toggle[aria-pressed="true"] .val { color: var(--green); text-shadow: 0 0 6px var(--green); }
  .toggle[aria-pressed="false"] .val { color: var(--muted); }
  .toggle:disabled { opacity: 0.45; cursor: not-allowed; }
  .toggle:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }

  .meter { display: flex; gap: 3px; height: 14px; margin: 12px 0 4px; }
  .meter i { flex: 1; background: rgba(90, 160, 200, 0.15); transition: background .08s; }
  .meter i.lit { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .meter i.lit.hot { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .meter-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); }

  .btn {
    border: 1px solid var(--line-2); background: rgba(40, 90, 120, 0.25); padding: 8px 14px; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .btn:hover { background: rgba(60, 130, 170, 0.35); }
  .btn.primary { border-color: var(--green); color: var(--green); background: rgba(40, 140, 90, 0.18); }
  .btn.danger { border-color: var(--red); color: var(--red); background: rgba(160, 40, 60, 0.18); }
  .btn.wide { width: 100%; margin-top: 12px; }

  /* ---- center: comms ---- */
  .center { grid-area: center; }
  .log { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .entry { max-width: 820px; }
  .entry .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .entry.user .who { color: var(--cyan-dim); }
  .entry.assistant .who { color: var(--state); }
  .entry .text { white-space: pre-wrap; word-wrap: break-word; }
  .entry.user .text { color: #a9d6ea; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
  .links span {
    font-size: 12px; padding: 1px 8px; border: 1px solid rgba(61, 245, 156, 0.4); color: var(--green);
    background: rgba(61, 245, 156, 0.07);
  }
  .meta { font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
  .note { font-size: 13px; color: var(--amber); }
  .err { color: var(--red); }
  .caption { min-height: 26px; padding: 2px 20px; color: var(--green); font-style: italic; }
  .compose { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .compose input {
    flex: 1; background: rgba(5, 18, 28, 0.8); border: 1px solid var(--line-2); padding: 10px 12px;
  }
  .compose input::placeholder { color: var(--muted); }
  .empty-log { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  .empty-log b { color: var(--cyan); }

  /* ---- right column ---- */
  .right { grid-area: right; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .field { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .field label { flex: 1; font-size: 13px; }
  select {
    background: rgba(5, 18, 28, 0.8); border: 1px solid var(--line-2); padding: 5px 8px; min-width: 150px;
  }
  .stat { display: grid; grid-template-columns: 96px 1fr 56px; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
  .stat .bar { height: 10px; background: rgba(90, 160, 200, 0.12); border: 1px solid var(--line); position: relative; }
  .stat .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--cyan-dim) 0 14px, transparent 14px 17px); transition: width .4s; }
  .stat .bar.red i { background: repeating-linear-gradient(90deg, var(--red) 0 14px, transparent 14px 17px); }
  .stat .num { text-align: right; font-family: var(--mono); font-size: 12px; }
  .memories { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 16px 12px; }
  .mem { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-bottom: 1px solid rgba(60, 110, 140, 0.35); font-size: 13px; }
  .mem time { grid-column: 1; font: 11px var(--mono); color: var(--muted); }
  .mem button { grid-row: 1 / span 2; grid-column: 2; align-self: center; background: none; border: 1px solid rgba(255, 64, 95, 0.5); color: var(--red); cursor: pointer; font-size: 11px; padding: 2px 6px; }
  .mem .lock { color: var(--amber); }
  .syslog { max-height: 150px; overflow-y: auto; padding: 8px 16px; font: 11px/1.6 var(--mono); color: var(--muted); }
  .syslog div span { color: var(--cyan-dim); margin-right: 6px; }

  .foot { grid-area: foot; display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); }

  @media (max-width: 1100px) {
    .hud { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "left" "center" "right" "foot"; grid-template-rows: auto; height: auto; }
    .center .inner { min-height: 70vh; }
    .core { max-width: 380px; }
    .status-pill b { min-width: 0; }
    .clock { display: none; }
  }
  @media (max-width: 520px) {
    .hud { padding: 12px; gap: 12px; }
    .brand { font-size: 18px; }
    .status-pill { padding: 6px 10px; font-size: 12px; }
    .status-pill .lbl { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin, .pulse { animation: none !important; }
  }
</style>
</head>
<body data-state="idle">
<div class="hud">
  <header class="topbar">
    <div class="brand caps">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="none" stroke="#8eeaff" stroke-width="2"/>
        <polygon points="20,11 27.5,15.5 27.5,24.5 20,29 12.5,24.5 12.5,15.5" fill="#8eeaff" opacity="0.35"/>
        <circle cx="20" cy="20" r="3.5" fill="#8eeaff"/>
      </svg>
      <span data-name>Assistant</span>
    </div>
    <div class="status-pill caps" role="status" aria-live="polite">
      <span class="lbl">System status:</span> <b id="status">Standby</b>
    </div>
    <div class="clock caps" id="clock"></div>
  </header>

  <section class="left">
    <div class="core" aria-hidden="true">
      <div class="badge" id="badge">000%</div>
      <div class="callout tl caps">Voice wake <b id="wake-word-callout">—</b></div>
      <div class="callout br caps">Memory links <b id="links-count">0</b></div>
      <svg viewBox="-200 -200 400 400">
        <g class="spin">
          <circle class="ring" r="188" stroke-width="2" stroke-dasharray="2 9" opacity="0.8"/>
        </g>
        <g class="spin rev">
          <circle class="state" r="172" fill="none" stroke-width="5" stroke-dasharray="320 60 140 60 220 281" opacity="0.75"/>
        </g>
        <circle class="ring" r="156" stroke-width="1"/>
        <circle class="sector" r="122" stroke-width="44" stroke-dasharray="113 15"/>
        <g opacity="0.5">
          <line x1="-156" y1="0" x2="-60" y2="0" stroke="#3d6d8c" stroke-dasharray="6 6"/>
          <line x1="60" y1="0" x2="156" y2="0" stroke="#3d6d8c" stroke-dasharray="6 6"/>
          <line x1="0" y1="-156" x2="0" y2="-60" stroke="#3d6d8c" stroke-dasharray="6 6"/>
          <line x1="0" y1="60" x2="0" y2="156" stroke="#3d6d8c" stroke-dasharray="6 6"/>
        </g>
        <rect x="-150" y="-12" width="62" height="24" fill="rgba(10,30,45,0.9)" stroke="#3d6d8c"/>
        <text x="-119" y="4" text-anchor="middle" id="turns-readout">00000</text>
        <rect x="88" y="-12" width="62" height="24" fill="rgba(10,30,45,0.9)" stroke="#3d6d8c"/>
        <text x="119" y="4" text-anchor="middle" id="mem-readout">00000</text>
        <g class="spin rev">
          <polygon class="fill-state" points="0,-92 9,-77 -9,-77"/>
          <polygon class="fill-state" points="0,-92 9,-77 -9,-77" transform="rotate(120)"/>
          <polygon class="fill-state" points="0,-92 9,-77 -9,-77" transform="rotate(240)"/>
        </g>
        <circle class="ring" r="66" stroke-width="2"/>
        <g class="pulse">
          <circle class="state" r="48" fill="rgba(10,30,45,0.6)" stroke-width="3"/>
        </g>
        <circle class="ring" r="30" stroke-width="1" stroke-dasharray="3 4"/>
        <circle class="fill-state" r="7"/>
        <text class="label" y="122" text-anchor="middle" id="core-label">STANDBY</text>
      </svg>
    </div>

    <div class="panel"><div class="inner">
      <div class="head caps"><span class="title">Wake control</span><span class="deco"><i></i><i></i></span></div>
      <div class="body">
        <button class="toggle caps" id="t-name" aria-pressed="false">
          <span class="name">Voice wake<br><span class="hint" id="name-hint">say the name, then your request</span></span>
          <span class="val">OFF</span>
        </button>
        <button class="toggle caps" id="t-clap" aria-pressed="false">
          <span class="name">Clap wake<br><span class="hint">clap twice to wake · clap twice to interrupt</span></span>
          <span class="val">OFF</span>
        </button>
        <button class="toggle caps" id="t-speak" aria-pressed="false">
          <span class="name">Voice reply<br><span class="hint">read answers aloud</span></span>
          <span class="val">OFF</span>
        </button>
        <div class="meter" id="meter" aria-hidden="true"></div>
        <div class="meter-label"><span>MIC</span><span id="mic-state">OFFLINE</span></div>
        <button class="btn primary wide caps" id="talk">◉ Tap to talk</button>
      </div>
    </div></div>
  </section>

  <section class="center panel"><div class="inner">
    <div class="head caps"><span class="title">Communications</span><span class="deco"><i></i><i></i></span></div>
    <div class="log" id="log" aria-live="polite">
      <div class="empty-log" id="empty-log">
        <p class="caps">Systems online</p>
        <p>Type below, tap to talk, or turn on a wake mode and say <b id="empty-wake">the name</b>.</p>
      </div>
    </div>
    <div class="caption" id="caption"></div>
    <form class="compose" id="form">
      <input id="input" autocomplete="off" placeholder="Enter command…" aria-label="Message">
      <button class="btn primary caps" type="submit">Transmit</button>
    </form>
  </div></section>

  <section class="right">
    <div class="panel"><div class="inner">
      <div class="head caps"><span class="title">Control panel</span><span class="deco"><i></i><i></i></span></div>
      <div class="body">
        <div class="field caps"><label for="model">Model</label><select id="model"></select></div>
        <button class="toggle caps" id="t-private" aria-pressed="false">
          <span class="name">Private<br><span class="hint">local models only</span></span><span class="val">OFF</span>
        </button>
        <button class="toggle caps" id="t-incognito" aria-pressed="false">
          <span class="name">Incognito<br><span class="hint">don't remember this</span></span><span class="val">OFF</span>
        </button>
        <div class="stat caps"><span>Latency</span><div class="bar"><i id="bar-lat"></i></div><span class="num" id="num-lat">—</span></div>
        <div class="stat caps"><span>Tokens in</span><div class="bar"><i id="bar-in"></i></div><span class="num" id="num-in">—</span></div>
        <div class="stat caps"><span>Tokens out</span><div class="bar red"><i id="bar-out"></i></div><span class="num" id="num-out">—</span></div>
      </div>
    </div></div>

    <div class="panel" style="flex: 1"><div class="inner">
      <div class="head caps"><span class="title">Memory bank</span><span class="deco"><i></i><i></i></span></div>
      <div class="memories" id="memories"></div>
    </div></div>

    <div class="panel"><div class="inner">
      <div class="head caps"><span class="title">System log</span><span class="deco"><i></i><i></i></span></div>
      <div class="syslog" id="syslog"></div>
    </div></div>
  </section>

  <footer class="foot caps">
    <span id="session">Session —</span>
    <span>Memory core · local</span>
  </footer>
</div>

<script type="module">
import { VoiceController } from "/static/voice.js";

const $ = (id) => document.getElementById(id);
let sessionId = null;
let turns = 0;
let memoryCount = 0;

const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(`hud.${key}`)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(`hud.${key}`, JSON.stringify(value)); } catch { /* storage off */ } },
};

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.status === 204 ? null : res.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const pad = (n, w = 5) => String(n).padStart(w, "0");

function log(text) {
  const line = el("div");
  line.append(el("span", "", new Date().toLocaleTimeString([], { hour12: false })), text);
  $("syslog").prepend(line);
}

// ---- clock ----
function tick() {
  const d = new Date();
  const mon = d.toLocaleString("en", { month: "short" }).toUpperCase();
  $("clock").textContent =
    `${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}  ${pad(d.getDate(), 2)}-${mon}-${String(d.getFullYear()).slice(2)}`;
}
tick();
setInterval(tick, 10_000);

// ---- mic meter ----
const SEGMENTS = 20;
for (let i = 0; i < SEGMENTS; i++) $("meter").append(el("i"));
let level = 0;
function drawMeter() {
  const lit = Math.round(Math.min(1, level * 1.6) * SEGMENTS);
  [...$("meter").children].forEach((seg, i) => {
    seg.classList.toggle("lit", i < lit);
    seg.classList.toggle("hot", i < lit && i >= SEGMENTS * 0.8);
  });
  $("badge").textContent = `${pad(Math.round(Math.min(1, level) * 100), 3)}%`;
  level *= 0.85;
  requestAnimationFrame(drawMeter);
}
requestAnimationFrame(drawMeter);

// ---- state display ----
let wakeWord = "Assistant";
const STATE_TEXT = {
  idle: () => "Standby",
  armed: () => [voice.nameWake && `Awaiting "${wakeWord}"`, voice.clapWake && "clap"].filter(Boolean).join(" · "),
  listening: () => "Listening…",
  thinking: () => "Processing…",
  speaking: () => "Speaking",
};
function showState(state) {
  document.body.dataset.state = state;
  const text = STATE_TEXT[state]();
  $("status").textContent = text;
  $("core-label").textContent = { idle: "STANDBY", armed: "ARMED", listening: "LISTENING", thinking: "PROCESSING", speaking: "SPEAKING" }[state];
}

// ---- voice ----
const voice = new VoiceController({
  wakeWord,
  onState: showState,
  onCommand: (text) => send(text, true),
  onLevel: (l) => { level = Math.max(level, l); },
  onTranscript: (t) => { $("caption").textContent = t ? `“${t}”` : ""; },
  onLog: log,
  onTypeInstead: () => $("input").focus(),
});

function setToggle(btn, on) {
  btn.setAttribute("aria-pressed", String(on));
  btn.querySelector(".val").textContent = on ? "ON" : "OFF";
}

$("t-name").onclick = async () => {
  const on = await voice.setNameWake($("t-name").getAttribute("aria-pressed") !== "true");
  setToggle($("t-name"), on);
  log(on ? `Voice wake on: say "${wakeWord}"` : "Voice wake off");
};
$("t-clap").onclick = async () => {
  const on = await voice.setClapWake($("t-clap").getAttribute("aria-pressed") !== "true");
  setToggle($("t-clap"), on);
  $("mic-state").textContent = on ? "LIVE" : "OFFLINE";
  log(on ? "Clap wake on: clap twice" : "Clap wake off");
};
$("t-speak").onclick = () => {
  const on = $("t-speak").getAttribute("aria-pressed") !== "true";
  voice.setSpeakReplies(on);
  setToggle($("t-speak"), on);
  store.set("speak", on);
};
$("talk").onclick = () => voice.wake();

for (const id of ["t-private", "t-incognito"]) {
  $(id).onclick = () => setToggle($(id), $(id).getAttribute("aria-pressed") !== "true");
}
const pressed = (id) => $(id).getAttribute("aria-pressed") === "true";

if (!voice.speechSupported) {
  $("t-name").disabled = true;
  $("name-hint").textContent = "needs Chrome, Edge or Safari";
}

// ---- memories ----
async function loadMemories() {
  const items = await api("/memories?limit=200");
  memoryCount = items.length;
  $("mem-readout").textContent = pad(memoryCount);
  const list = $("memories");
  list.replaceChildren();
  if (!items.length) {
    list.append(el("p", "off", "Nothing remembered yet."));
    return;
  }
  for (const m of items) {
    const row = el("div", "mem");
    const text = el("span", "", m.text);
    const when = el("time", "", new Date(m.occurred_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }));
    if (m.private) when.append(el("span", "lock", " · PRIVATE"));
    const forget = el("button", "caps", "Forget");
    forget.title = "Delete this memory";
    forget.onclick = async () => {
      await api(`/memories/${m.id}`, { method: "DELETE" });
      log("Memory deleted");
      loadMemories();
    };
    row.append(text, forget, when);
    list.append(row);
  }
}

// ---- chat ----
async function* sse(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i);
      buf = buf.slice(i + 2);
      const event = /^event: (.*)$/m.exec(chunk)?.[1];
      const data = /^data: (.*)$/m.exec(chunk)?.[1];
      if (event && data) yield { event, data: JSON.parse(data) };
    }
  }
}

function setBar(id, numId, value, max, text) {
  $(id).style.width = `${Math.min(100, (value / max) * 100)}%`;
  $(numId).textContent = text;
}

let sending = false;
async function send(text, spoken = false) {
  if (sending) return;
  sending = true;
  voice.busy();
  $("empty-log")?.remove();
  const logEl = $("log");
  const you = el("div", "entry user");
  you.append(el("div", "who caps", spoken ? "▸ You · voice" : "▸ You"), el("div", "text", text));
  const reply = el("div", "entry assistant");
  const body = el("div", "text");
  reply.append(el("div", "who caps", `◈ ${wakeWord}`), body);
  logEl.append(you, reply);
  logEl.scrollTop = logEl.scrollHeight;

  const started = performance.now();
  let answer = "";
  try {
    const res = await fetch(`/sessions/${sessionId}/chat`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        message: text,
        model: $("model").value || null,
        private: pressed("t-private"),
        incognito: pressed("t-incognito"),
      }),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    for await (const { event, data } of sse(res)) {
      if (event === "text") {
        answer += data.text;
        body.textContent = answer;
      } else if (event === "memory") {
        const links = el("div", "links");
        for (const m of data.memories) links.append(el("span", "", m.text));
        reply.insertBefore(links, body);
        $("links-count").textContent = String(data.memories.length);
      } else if (event === "notice") {
        reply.append(el("div", "note", data.text));
        log(data.text);
      } else if (event === "tool_call") {
        reply.append(el("div", "meta caps", `→ tool: ${data.name}`));
      } else if (event === "error") {
        reply.append(el("div", "err", data.message));
        log(`Error: ${data.message}`);
      } else if (event === "done") {
        const ms = performance.now() - started;
        const u = data.usage;
        reply.append(el("div", "meta caps", `${data.model_alias} · ${(ms / 1000).toFixed(1)}s`));
        setBar("bar-lat", "num-lat", ms, 15000, `${(ms / 1000).toFixed(1)}s`);
        setBar("bar-in", "num-in", u.input_tokens, 8000, String(u.input_tokens));
        setBar("bar-out", "num-out", u.output_tokens, 2000, String(u.output_tokens));
      }
      logEl.scrollTop = logEl.scrollHeight;
    }
  } catch (e) {
    reply.append(el("div", "err", `Link failure: ${e.message}`));
    log(`Request failed: ${e.message}`);
  } finally {
    turns += 1;
    $("turns-readout").textContent = pad(turns);
    sending = false;
    loadMemories().catch(() => {});
    await voice.done(answer);
  }
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  send(text);
};

// ---- start up ----
(async () => {
  const [cfg, models] = await Promise.all([api("/config"), api("/models")]);
  wakeWord = cfg.wake_word;
  voice.wakeWord = cfg.wake_word;
  document.title = cfg.assistant_name;
  document.querySelectorAll("[data-name]").forEach((n) => { n.textContent = cfg.assistant_name; });
  $("wake-word-callout").textContent = `“${cfg.wake_word.toUpperCase()}”`;
  $("empty-wake").textContent = `“${cfg.wake_word}”`;
  $("name-hint").textContent = voice.speechSupported ? `say “${cfg.wake_word}”, then your request` : "needs Chrome, Edge or Safari";

  const sel = $("model");
  sel.append(new Option(`Auto (${models.routes.chat})`, ""));
  for (const m of models.models) sel.append(new Option(`${m.alias}${m.local ? " · local" : ""}`, m.alias));
  sel.value = store.get("model", "");
  sel.onchange = () => store.set("model", sel.value);

  if (store.get("speak", false)) { voice.setSpeakReplies(true); setToggle($("t-speak"), true); }

  const session = await api("/sessions", { method: "POST", body: "{}" });
  sessionId = session.id;
  $("session").textContent = `Session ${session.id.slice(0, 8)}`;
  await loadMemories();
  log("Systems online");
  showState("idle");
})().catch((e) => log(`Startup failed: ${e.message}`));
</script>
